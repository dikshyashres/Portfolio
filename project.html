<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="project.css" />
    <link rel="icon" type="image/png" href="fa.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <header>
        <a href="portfolio" class="logo">Port<span>folio</span>.</a>
        <nav class="navbar">
          <a href="index.html">Home</a>
          <a href="project.html" class="active">Project</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>

      <div class="topic">
        <h1>My Projects</h1>
        <h2>Some of my distinguished work</h2>
      </div>

      <section class="box">
        <div class="card">
          <img src="threat.png" alt="Threat Detection System" />
          <h3>Threat Detection System</h3>
          <div class="buttons">
            <a
              href="https://github.com/dikshyashres/Threat-Detection-YOLOv8-.git"
              target="_blank"
              class="btn code"
              >Code</a
            >
            <button class="btn demo" onclick="openDemo('threat-demo.mp4')">
              <i class="fa-solid fa-circle-play"></i> Demo
            </button>
          </div>
        </div>

        <div class="card">
          <img src="tictac.jpg" alt="Tic Tac Toe" />
          <h3>Tic-Tac-Toe Game</h3>
          <div class="buttons">
            <a
              href="https://github.com/dikshyashres/tic-tac-toe.git"
              target="_blank"
              class="btn code"
              >Code</a
            >
            <button class="btn demo" onclick="openDemo('tictac-demo.mp4')">
              <i class="fa-solid fa-circle-play"></i> Demo
            </button>
          </div>
        </div>

        <div class="card">
          <img src="neuro.png" alt="NeuroVision" />
          <h3>NeuroVision</h3>
          <div class="buttons">
            <a
              href="https://github.com/dikshyashres/NeuroVision.git"
              target="_blank"
              class="btn code"
              >Code</a
            >
            <button class="btn demo" onclick="openDemo('neuro-demo.mp4')">
              <i class="fa-solid fa-circle-play"></i> Demo
            </button>
          </div>
        </div>

        <div class="card">
          <img src="ncell.jpg" alt="Ncell Certification & Compliant Website" />
          <h3>Ncell Certification &amp; Compliant</h3>
          <div class="buttons">
            <a
              href="https://www.ncell.com.np/en/business/certifications"
              target="_blank"
              class="btn demo"
            >
              <i class="fa-solid fa-arrow-up-right-from-square"></i> Live
            </a>
          </div>
        </div>

        <div class="card">
          <img src="todo.png" alt="Simple Todo List" />
          <h3>Simple Todo List</h3>
          <div class="buttons">
            <a
              href="https://github.com/dikshyashres/Simple-todo-list.git"
              target="_blank"
              class="btn code"
              >Code</a
            >
            <button class="btn demo" onclick="openDemo('todo_list.mp4')">
              <i class="fa-solid fa-circle-play"></i> Demo
            </button>
          </div>
        </div>
      </section>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeDemo()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeDemo()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <video id="modalVideo" controls autoplay></video>
      </div>
    </div>

    <script>
      function openDemo(src) {
        const overlay = document.getElementById('modalOverlay')
        const video = document.getElementById('modalVideo')
        video.src = src
        overlay.classList.add('active')
        video.play()
      }

      function closeDemo() {
        const overlay = document.getElementById('modalOverlay')
        const video = document.getElementById('modalVideo')
        video.pause()
        video.src = ''
        overlay.classList.remove('active')
      }
    </script>
  </body>
</html>
